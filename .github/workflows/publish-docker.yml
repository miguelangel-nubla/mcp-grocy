name: Publish Docker Image

run-name: 'Publish Docker ${{ inputs.release_version || github.ref_name }}'

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      release_version:
        required: true
        type: string

concurrency:
  group: publish-docker-${{ inputs.release_version || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-docker:
    name: Publish Docker Image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ inputs.release_version || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_version || github.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists
        id: check_image
        run: |
          echo "Checking if Docker image for version $RELEASE_VERSION already exists..."
          if docker buildx imagetools inspect ghcr.io/${{ github.repository }}:$RELEASE_VERSION &>/dev/null; then
            echo "image_exists=true" >> $GITHUB_OUTPUT
          else
            echo "image_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Docker
        if: steps.check_image.outputs.image_exists != 'true'
        uses: ./.github/actions/setup-docker

      - name: Determine Docker Tags
        id: docker_tags
        run: |
          VERSION="${{ env.RELEASE_VERSION }}"
          echo "Determining tags for version: $VERSION"

          TAGS="ghcr.io/${{ github.repository }}:$VERSION"

          # Only tag :latest if this is a stable release (e.g. v1.2.3, not containing hyphen like -dev or -beta)
          if [[ "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable release detected; tagging as latest as well."
            TAGS="$TAGS
          ghcr.io/${{ github.repository }}:latest"
          else
            echo "Prerelease or custom tag detected ($VERSION); skipping latest tag."
          fi

          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push multi-platform image
        if: steps.check_image.outputs.image_exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RELEASE_VERSION=${{ env.RELEASE_VERSION }}
          tags: ${{ steps.docker_tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker Publish Summary
        run: |
          if [[ "${{ steps.check_image.outputs.image_exists }}" == "true" ]]; then
            echo "Image for version $RELEASE_VERSION already exists in the registry. No new image was built."
          else
            echo "Successfully built and published Docker image for version $RELEASE_VERSION"
          fi
