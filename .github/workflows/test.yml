name: Test

run-name: 'Test ${{ github.ref_name }}@${{ github.sha }}'

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_ENV: test
  MOCK_API: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Run tests
        run: npm test

  mcp-inspector:
    name: MCP Inspector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Build server
        run: npm run build

      - name: Verify MCP initialization
        run: npx --yes @modelcontextprotocol/inspector --cli node build/main.js --method initialize

      - name: Verify MCP tools and schema strictness
        run: npx --yes @modelcontextprotocol/inspector --cli node build/main.js --method tools/list --strict

      - name: Verify MCP resources
        run: npx --yes @modelcontextprotocol/inspector --cli node build/main.js --method resources/list

      - name: Smoke test tool call
        env:
          MOCK_API: true
        run: npx --yes @modelcontextprotocol/inspector --cli node build/main.js --method tools/call --tool-name system_locations_get

  test-build:
    name: Test Docker Image Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker
        uses: ./.github/actions/setup-docker

      - name: Test build multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:dev-${{ github.sha }}
